plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.entros'
version = '0.1.0'

android {
  namespace "io.entros.playintegrity"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Standard requests: a prepared token provider and a per-request hash.
  implementation 'com.google.android.play:integrity:1.6.0'
}
