  name: Entros Protocol
  address: TODO_PUBLISHER_BASE58_ADDRESS
  website: https://entros.io
  email: TODO_CONTACT_EMAIL

app:
  name: entros-mobile
  android_package: io.entros.mobile
  urls:
    license_url: https://github.com/entros-protocol/entros-mobile/blob/main/LICENSE
    copyright_url: https://entros.io
    privacy_policy_url: https://entros.io/privacy
    website: https://entros.io

release:
  android_details:
    android_package: io.entros.mobile
    min_sdk: 24
    version_code: TODO_VERSION_CODE
    version: TODO_VERSION
  catalog:
    en-US:
      name: Entros
      short_description: Solana-native Proof-of-Personhood for Seeker.
      long_description: |
        Entros is a proof-of-personhood app for Solana. A verification asks
        you to read a short phrase aloud, trace a path on the screen, and hold
        the phone while the app records voice, motion, and touch.

        Raw motion and touch recordings stay on the device. The app sends a
        feature summary, pitch and motion contours, a coarse outline of the
        traced path, and the spoken-phrase audio to the Entros validation
        service. The service transcribes the audio transiently and does not
        store it. The on-chain submission carries a zero-knowledge proof and
        its public inputs.
      new_in_version: Initial release.
      saga_features: TODO_SAGA_FEATURES
