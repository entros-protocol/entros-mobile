name: Feature request
description: Suggest a new feature or change.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need before any solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How would you like it to work? Sketches and mockups welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you ruled them out.
  - type: dropdown
    id: scope
    attributes:
      label: Where does this fit?
      options:
        - Onboarding / Connect
        - Verification flow
        - Dashboard / Activity
        - Settings
        - Wallet / MWA
        - Sensors / Permissions
        - Performance
        - Other
    validations:
      required: true
